server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:true}
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json
    min-response-size: 2048

spring:
  application:
    name: nooshet-api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:${REDIS_HOST:redis}}
      port: ${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: ${SPRING_REDIS_TIMEOUT:${REDIS_TIMEOUT:2000ms}}
  
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:200}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:50}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            logger-level: BASIC
    gateway:
      routes:
        - id: identity-service
          uri: http://identity-service:8080
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - StripPrefix=0
            - RequestRateLimiter=redisRateLimiter

        # OpenApi Routes
        - id: identity-service-openapi
          uri: http://identity-service:8080
          predicates:
            - Path=/v3/api-docs/identity-service
          filters:
            - SetPath=/v3/api-docs

        - id: user-service-openapi
          uri: http://user-service:8080
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      identity-service:
        timeoutDuration: 30s
        cancelRunningFuture: true
      user-service:
        timeoutDuration: 30s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path-mapping: true
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - url: /v3/api-docs/identity-service
        name: identity-service
      - url: /v3/api-docs/user-service
        name: user-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.nooshet.gateway: DEBUG
